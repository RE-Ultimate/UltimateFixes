plugins {
	id 'com.unascribed.nilgradle' version '1.4.7'
}

sourceCompatibility = 8
targetCompatibility = 8

compileJava.options.encoding = 'UTF-8'

group = 'com.reultimate'
archivesBaseName = 'UltimateFixes'
version = '1.8.1-reultimate.1'

repositories {
	mavenCentral {
		content {
			includeGroup 'org.lwjgl.lwjgl'
			includeGroup 'junit'
			includeGroup 'org.hamcrest'
		}
	}
	maven {
		url 'https://raw.githubusercontent.com/RE-Ultimate/maven/main'
		content {
			includeGroup 'com.unascribed'
		}
	}
	maven {
		url 'https://maven.minecraftforge.net'
		metadataSources {
			artifact()
		}
		content {
			includeGroup 'net.minecraftforge'
		}
	}
	mavenLocal()
	flatDir {
		dirs 'libs'
		content {
			includeGroup 'libs'
		}
	}
}

nil {
	id "upsilonfixes"
	standalone false
}

dependencies {
	loader 'com.unascribed:nilloader:1.3.1'

	implementation('org.lwjgl.lwjgl:lwjgl:2.9.3') {
		transitive = false
	}

	game nil.minecraft('1.4.7', 'client')
	mod 'net.minecraftforge:forge:1.4.7-6.6.2.534:universal@zip'
	mod 'libs:IC2'
	mod 'libs:RedPowerCore'
	mod 'libs:RedPowerDigital'
	mod 'libs:RedPowerMechanical'
	mod 'libs:ChiselRetro'
	mod 'libs:GregTech'
	mod 'libs:LogisticsPipes'
	mod 'libs:XyCraft'
	mod 'libs:ThermalExpansion'
	mod 'libs:BuildCraft'
	mod 'libs:DartCraft'
	mod 'libs:TwilightForest'
	mod 'libs:GravityGun'
	mod 'libs:Factorization'
	mod 'libs:NEI'
	mod 'libs:ImmibisCore'
	mod 'libs:Tubestuff'
	mod 'libs:MiscPeripherals'
	mod 'libs:XReliquary'
	mod 'libs:CodeChickenCore'
	mod 'libs:ComputerCraft'
	mod 'libs:Forestry'
	mod 'libs:Thaumcraft'
	mod 'libs:MineFactoryReloaded'
	testImplementation 'junit:junit:4.13.2'
	testRuntimeOnly fileTree('libs/pack/lib') { include '*.jar' }
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
tasks.register('prepareTestEnchantments', Copy) {
	dependsOn compileJava
	from zipTree('build/nil/cache/net.minecraftforge.forge-1.4.7-6.6.2.534-universal.jar')
	include 'net/minecraft/enchantment/Enchantment.class'
	into 'build/test-enchantments'
}

test.dependsOn prepareTestEnchantments
sourceSets.test.runtimeClasspath = files('build/test-enchantments') + sourceSets.test.runtimeClasspath

mappings {
	work 'com.unascribed:unknownthingy:1.19@tsrg'
}
